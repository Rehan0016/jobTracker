spring.application.name=jobtracker-test

# Use in-memory H2 database for tests to run tests isolated and quickly without external DB dependencies
spring.datasource.url=jdbc:h2:mem:jobtrackertest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# JWT Test Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# CORS Test Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:5173
