# ===================================================================
# Common Base Application Configuration
# Profile-specific configurations are in application-dev.properties
# and application-prod.properties.
# ===================================================================

spring.application.name=jobtracker

# Active Spring Profile (defaults to prod if not specified)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# Server Port
server.port=${PORT:${SERVER_PORT:8080}}

# Common JPA / Hibernate Configuration
spring.jpa.open-in-view=false

# Default PostgreSQL Connection (Supabase Pooler)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.hmeufaqxjfjgjjcipsee}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Common CORS Configuration (overridable via CORS_ALLOWED_ORIGINS)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
