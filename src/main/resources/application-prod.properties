
# Production Profile (prod)

# Aiven Cloud MySQL Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-13df9df7-jobtracker-cloud.c.aivencloud.com:21567/jobtracker?sslMode=REQUIRED&serverTimezone=UTC}
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Database already migrated to Aiven
spring.sql.init.mode=never

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Logging
logging.level.root=WARN
logging.level.com.rehan.jobtracker=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=ERROR
